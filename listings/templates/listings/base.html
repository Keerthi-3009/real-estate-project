<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Real Estate Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div>
    <a href="{% url 'property_list' %}" class="btn btn-outline-light btn-sm">Home</a>
    {% if user.is_authenticated %}
        <a href="{% url 'property_create' %}" class="btn btn-outline-light btn-sm">Add Property</a>
    <span class="text-light me-2">Hi, {{ user.username }}</span>
    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
    {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Login</a>
        <a href="{% url 'signup' %}" class="btn btn-outline-light btn-sm">Sign Up</a>
    {% endif %}
    <a href="/admin/" class="btn btn-outline-light btn-sm">Admin</a>
</div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
