{% extends 'listings/base.html' %}
{% block title %}{% if editing %}Edit Property{% else %}Add Property{% endif %}{% endblock %}
{% block content %}
<h1 class="mb-4">{% if editing %}Edit Property{% else %}Add a New Property{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mb-3">
        <label class="form-label">Upload Images {% if editing %}(add more){% endif %}</label>
        <input type="file" name="images" multiple class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Save Property</button>
</form>
{% endblock %}
