{% extends 'listings/base.html' %}
{% block title %}Buyer Sign Up{% endblock %}
{% block content %}
<h1 class="mb-4">Looking to Buy a Property?</h1>
<p>Tell us what you're looking for, and one of our agents will reach out to you directly.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
