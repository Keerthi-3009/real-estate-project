{% extends 'listings/base.html' %}
{% block title %}Sell Your Property{% endblock %}
{% block content %}
<h1 class="mb-4">Want to Sell Your Land, Villa, or House?</h1>
<p>Leave your details below and one of our agents will review and contact you.</p>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mb-3">
        <label class="form-label">Upload Property Images</label>
        <input type="file" name="images" multiple class="form-control">
    </div>
    <button type="submit" class="btn-colorful">Submit</button>
</form>
{% endblock %}
